<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quizzes | Pro Learning</title><link rel="stylesheet" href="style.css"><style>
.quiz-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quiz-controls label{display:block;font-weight:600}.quiz-controls select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #d7d2e4;border-radius:9px;font:inherit}.question{
  border:1px solid #b99b45;border-radius:16px;padding:16px;margin:14px 0;
  background:#24143b;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.16)
}
.question h3{margin:0 0 14px;color:#fff;font-size:1.08rem;line-height:1.55;font-weight:700}
.answer-option{
  display:flex;width:100%;box-sizing:border-box;gap:12px;align-items:center;
  margin:10px 0;padding:13px 12px;border:1px solid rgba(231,215,255,.42);
  border-radius:12px;background:#33204d;color:#fff;font-weight:500;
  font-size:1rem;line-height:1.45;cursor:pointer;min-height:50px;
  transition:background .15s ease,border-color .15s ease
}
.answer-option input{flex:0 0 auto;width:20px;height:20px;margin:0;accent-color:#e0b84e}
.answer-option:has(input:checked){background:#4a3267;border:2px solid #e0b84e;padding:12px 11px;color:#fff}
.answer-option:focus-within{outline:2px solid #e0b84e;outline-offset:2px}.quiz-result{padding:14px;border-radius:12px;background:#f3effb;margin-top:14px}.quiz-note{color:#6b647b;font-size:.9rem}@media(max-width:520px){.quiz-controls{grid-template-columns:1fr}.question{padding:14px}.question h3{font-size:1.02rem}.answer-option{padding:12px 10px;min-height:52px}}
</style></head><body><header class="topbar"><a class="brand brand-link" href="pro.html"><span class="brand-mark">✦</span> PRO LEARNING</a><a class="btn btn-ghost" href="pro.html">← Student dashboard</a></header><main class="dashboard"><div class="eyebrow">ECZ PRACTICE</div><h1>Quizzes</h1><p class="muted">Practice multiple-choice questions and review your answers.</p><section class="panel"><div class="quiz-controls"><label>Subject<select id="subject"><option value="Biology">Biology</option><option value="Chemistry">Chemistry</option><option value="Physics">Physics</option><option value="Mathematics">Mathematics</option><option value="Computer Studies">Computer Studies</option></select></label><label>Practice set<select id="set"><option value="0">Set 1</option><option value="1">Set 2</option></select></label></div><p class="quiz-note">Questions in this starter version are sample revision questions. Your score is saved on this device only.</p><form id="quiz-form"><div id="questions"></div><button class="btn btn-gold" type="submit">Submit answers</button><button class="btn btn-ghost" id="retry" type="button" hidden>Try again</button></form><div id="result" class="quiz-result" role="status" hidden></div></section><section class="panel"><h2>Recent quiz scores</h2><div id="history"></div><button id="clear-history" class="btn btn-ghost" type="button">Clear scores on this device</button></section></main><script src="quizzes.js"></script><script src="floating-nav.js"></script></body></html>
