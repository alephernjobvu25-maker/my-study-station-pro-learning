<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quizzes | Pro Learning</title><link rel="stylesheet" href="style.css"><style>
.quiz-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quiz-controls label{display:block;font-weight:600}.quiz-controls select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #d7d2e4;border-radius:9px;font:inherit}.question{border:1px solid #e2dced;border-radius:12px;padding:14px;margin:12px 0;background:#fff}.question h3{margin:0 0 10px}.answer-option{display:flex;gap:9px;align-items:flex-start;margin:9px 0;font-weight:normal}.answer-option input{margin-top:4px}.quiz-result{padding:14px;border-radius:12px;background:#f3effb;margin-top:14px}.quiz-note{color:#6b647b;font-size:.9rem}@media(max-width:520px){.quiz-controls{grid-template-columns:1fr}}
</style></head><body><header class="topbar"><a class="brand brand-link" href="pro.html"><span class="brand-mark">✦</span> PRO LEARNING</a><a class="btn btn-ghost" href="pro.html">← Student dashboard</a></header><main class="dashboard"><div class="eyebrow">ECZ PRACTICE</div><h1>Quizzes</h1><p class="muted">Practice multiple-choice questions and review your answers.</p><section class="panel"><div class="quiz-controls"><label>Subject<select id="subject"><option value="Biology">Biology</option><option value="Chemistry">Chemistry</option><option value="Physics">Physics</option><option value="Mathematics">Mathematics</option><option value="Computer Studies">Computer Studies</option></select></label><label>Practice set<select id="set"><option value="0">Set 1</option><option value="1">Set 2</option></select></label></div><p class="quiz-note">Questions in this starter version are sample revision questions. Your score is saved on this device only.</p><form id="quiz-form"><div id="questions"></div><button class="btn btn-gold" type="submit">Submit answers</button><button class="btn btn-ghost" id="retry" type="button" hidden>Try again</button></form><div id="result" class="quiz-result" role="status" hidden></div></section><section class="panel"><h2>Recent quiz scores</h2><div id="history"></div><button id="clear-history" class="btn btn-ghost" type="button">Clear scores on this device</button></section></main><script src="quizzes.js"></script></body></html>
