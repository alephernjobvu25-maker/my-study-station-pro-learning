<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Timetable | My Study Station</title>
  <style>
    :root { --bg:#100d25; --panel:#1d1738; --panel2:#271f49; --gold:#f4c542; --text:#f7f4ff; --muted:#b9b2d2; --line:#40365f; --danger:#ff7272; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    header { padding:20px 16px; background:linear-gradient(135deg,#211747,#100d25); border-bottom:1px solid var(--line); }
    header .wrap, main { max-width:900px; margin:auto; }
    h1 { margin:0 0 6px; font-size:1.55rem; color:var(--gold); }
    p { margin:0; color:var(--muted); }
    main { padding:16px; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
    h2 { margin:0 0 14px; font-size:1.1rem; }
    form { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    label { display:block; font-size:.88rem; color:var(--muted); }
    input,select,button { font:inherit; }
    input,select { width:100%; margin-top:6px; padding:11px; border-radius:10px; border:1px solid var(--line); background:#120f2b; color:var(--text); }
    .full { grid-column:1/-1; }
    button { border:0; border-radius:10px; padding:11px 14px; font-weight:700; cursor:pointer; }
    .primary { background:var(--gold); color:#211747; }
    .secondary { background:var(--panel2); color:var(--text); border:1px solid var(--line); }
    .days { display:flex; gap:8px; overflow:auto; padding-bottom:10px; margin-bottom:12px; }
    .daybtn { flex:0 0 auto; background:var(--panel2); color:var(--text); border:1px solid var(--line); }
    .daybtn.active { background:var(--gold); color:#211747; }
    .session { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px; margin:9px 0; border-radius:12px; background:var(--panel2); border:1px solid var(--line); }
    .session strong { display:block; }
    .session small { color:var(--muted); }
    .actions { display:flex; gap:7px; flex-wrap:wrap; }
    .actions button { padding:8px 10px; }
    .delete { color:var(--danger); }
    .empty { color:var(--muted); text-align:center; padding:18px 8px; }
    @media(max-width:520px) { form { grid-template-columns:1fr; } .full { grid-column:auto; } .session { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
<header><div class="wrap">
  <h1>📅 Study Timetable</h1>
  <p>Plan your study sessions for the week.</p>
</div></header>
<main>
  <section class="panel">
    <h2 id="formTitle">Add a study session</h2>
    <form id="sessionForm">
      <label>Subject
        <select id="subject" required>
          <option>Mathematics</option><option>English Language</option><option>Biology</option>
          <option>Physics</option><option>Chemistry</option><option>Civic Education</option>
          <option>Additional Mathematics</option><option>Computer Studies</option><option>Other</option>
        </select>
      </label>
      <label>Day
        <select id="day" required>
          <option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option>
          <option>Friday</option><option>Saturday</option><option>Sunday</option>
        </select>
      </label>
      <label>Start time <input id="start" type="time" required></label>
      <label>End time <input id="end" type="time" required></label>
      <label class="full">Topic / notes (optional) <input id="topic" maxlength="120" placeholder="e.g. Organic chemistry revision"></label>
      <div class="full" style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="primary" type="submit" id="saveBtn">Save session</button>
        <button class="secondary" type="button" id="cancelEdit" hidden>Cancel edit</button>
      </div>
    </form>
  </section>
  <section class="panel">
    <h2>Your weekly plan</h2>
    <div class="days" id="dayTabs" aria-label="Choose day"></div>
    <div id="sessions"></div>
  </section>
</main>
<script src="timetable.js"></script>
</body>
</html>
