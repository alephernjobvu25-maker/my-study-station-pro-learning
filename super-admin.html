<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Administrator | My Study Station Pro Learning</title>
<style>
:root{color-scheme:dark;--bg:#090d20;--panel:#121a30;--line:#2b3b5c;--text:#edf3ff;--muted:#a9b6d1;--gold:#f3d276}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28235b 0,#090d20 55%);color:var(--text);font:15px system-ui}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}main{max-width:850px;margin:auto;padding:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0}.tag{color:var(--gold);font-size:11px;letter-spacing:1px}h1{margin:8px 0}p{color:var(--muted);line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap}a,button{border-radius:10px;padding:11px 14px;background:#6657d9;color:white;text-decoration:none;border:0;font-weight:700}button.secondary,a.secondary{background:#202c45;border:1px solid var(--line)}#status{color:var(--gold)}
</style></head><body><header><b>My Study Station <span style="color:#f3d276">PRO</span></b><button id="logout" class="secondary">Sign out</button></header><main><div class="tag">OWNER-ONLY SECURE WORKSPACE</div><h1>Super Administrator</h1><p>Only an active Super Administrator can enter this workspace. Access is checked using the database RPC.</p><section class="card"><p id="status">Verifying your session and role…</p><div id="tools" class="actions" hidden><a href="admin-management.html">Manage administrators</a><a class="secondary" href="admin.html">Admin portal</a><a class="secondary" href="index.html">Main website</a></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
(async()=>{const status=document.getElementById('status'),tools=document.getElementById('tools');const client=window.supabaseClient;if(!client){status.textContent='Supabase client initialization failed. Verify supabase.js.';return;}
try{const {data:{session},error:sErr}=await client.auth.getSession();if(sErr||!session){location.replace('admin-login.html');return;}const {data:allowed,error}=await client.rpc('is_super_admin');if(error)throw error;if(allowed!==true){status.textContent='Access denied: this account is not the active Super Administrator.';await client.auth.signOut();return;}status.textContent='Super Administrator verified. Your private workspace is ready.';tools.hidden=false;}catch(e){status.textContent='Could not verify administrator role: '+(e.message||'Unknown error');}
})();document.getElementById('logout').addEventListener('click',async()=>{if(window.supabaseClient)await window.supabaseClient.auth.signOut();location.replace('admin-login.html');});
</script></body></html>
