<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Study Station Pro | Super Admin</title>
<style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#172239;--line:#26344f;--text:#edf2ff;--muted:#9eacc8;--gold:#f3c969;--purple:#8b7cff;--green:#45d6a2;--red:#ff7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);background:#0d1426;position:sticky;top:0;z-index:5}
.brand{font-weight:800;letter-spacing:.2px}.brand span{color:var(--gold)}.header-right{display:flex;gap:10px;align-items:center}
.pill{border:1px solid #64552d;color:var(--gold);padding:6px 10px;border-radius:99px;font-size:12px}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--purple);color:white;font-weight:700;cursor:pointer}button.secondary{background:#202c45;border:1px solid var(--line)}button.danger{background:#8e3044}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 65px)}
aside{padding:18px 12px;border-right:1px solid var(--line);background:#0d1426}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);padding:10px 12px}
nav button{display:block;width:100%;text-align:left;background:transparent;color:#c6d2eb;padding:11px 12px;margin:3px 0;border:1px solid transparent;font-weight:600}
nav button.active,nav button:hover{background:var(--panel2);border-color:var(--line);color:white}
main{padding:24px;max-width:1400px;width:100%;margin:auto}.welcome{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}
h1{margin:0 0 8px;font-size:26px}p{color:var(--muted);margin:0;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}
.metric{font-size:27px;font-weight:800;margin:8px 0}.small{font-size:12px;color:var(--muted)}
.section-title{font-size:18px;font-weight:800;margin:25px 0 12px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick .card{cursor:pointer;transition:.15s}.quick .card:hover{border-color:var(--purple);transform:translateY(-1px)}
.notice{padding:14px;border:1px solid #66552e;background:#2b2518;border-radius:12px;color:#f5d991;margin:16px 0}
#contentArea{min-height:300px}.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
#status{font-size:13px;color:var(--muted)}.access-denied{max-width:500px;margin:12vh auto;padding:26px;text-align:center}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}}
@media(max-width:650px){header{padding:12px}.layout{display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px}nav{display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;width:auto;padding:9px 11px} .nav-label{display:none}main{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:1fr}.welcome{display:block}.welcome button{margin-top:12px}}
</style>
</head>
<body>
<header>
  <div class="brand">My Study Station <span>PRO</span></div>
  <div class="header-right"><span class="pill">SUPER ADMIN</span><button class="secondary" id="logoutBtn">Sign out</button></div>
</header>
<div id="app">
  <div class="access-denied"><h1>Verifying access…</h1><p id="status">Checking your Super Administrator account.</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
(async function(){
  const app=document.getElementById('app');
  const status=document.getElementById('status');
  if(!window.supabaseClient){app.innerHTML='<div class="access-denied"><h1>Setup required</h1><p>Could not find <b>supabaseClient</b>. Please check your existing supabase.js file and its client variable name.</p></div>';return;}
  try{
    const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
    if(sessionError||!session){location.replace('admin-login.html');return;}
    const {data:allowed,error}=await supabaseClient.rpc('is_super_admin');
    if(error||allowed!==true){app.innerHTML='<div class="access-denied"><h1>Access denied</h1><p>This workspace is restricted to the active Super Administrator.</p><br><button id="deniedSignout" class="danger">Sign out</button></div>';document.getElementById('deniedSignout').onclick=async()=>{await supabaseClient.auth.signOut();location.replace('admin-login.html');};return;}
    const email=session.user.email||'Super Administrator';
    app.innerHTML=`
      <div class="layout">
       <aside><div class="nav-label">Owner workspace</div><nav id="nav">
        <button class="active" data-page="Overview">▦ Overview</button>
        <button data-page="Admin Management">♙ Admin Management</button>
        <button data-page="Users">♧ Users</button>
        <button data-page="Schools">▤ Schools</button>
        <button data-page="Learning Content">▣ Learning Content</button>
        <button data-page="Video Lessons">▷ Video Lessons</button>
        <button data-page="Quizzes & Progress">✓ Quizzes & Progress</button>
        <button data-page="Community">◎ Community</button>
        <button data-page="Membership">★ K25 Membership</button>
        <button data-page="Security">⌑ Security</button>
        <button data-page="Audit Logs">≡ Audit Logs</button>
        <button data-page="Analytics">▥ Analytics</button>
        <button data-page="Settings">⚙ Settings</button>
       </nav></aside>
       <main>
        <div class="welcome"><div><h1 id="pageTitle">Super Admin Overview</h1><p>Full-owner control center for My Study Station Pro Learning.</p><p class="small" style="margin-top:6px">Signed in as ${escapeHtml(email)}</p></div><span class="pill">Verified by Supabase</span></div>
        <div id="contentArea"></div>
       </main>
      </div>`;
    const overview=`
      <div class="notice">Owner access is verified from the Supabase database. This page is the secure workspace shell; module data actions will be connected step by step.</div>
      <div class="grid">
       <div class="card"><div class="small">Admin roles</div><div class="metric">—</div><div class="small">Connect admin management</div></div>
       <div class="card"><div class="small">Registered users</div><div class="metric">—</div><div class="small">Connect user directory</div></div>
       <div class="card"><div class="small">Schools</div><div class="metric">—</div><div class="small">Connect school records</div></div>
       <div class="card"><div class="small">Audit events</div><div class="metric">—</div><div class="small">Connect audit log viewer</div></div>
      </div>
      <div class="section-title">Workspace shortcuts</div>
      <div class="quick">
       ${['Admin Management','Users','Schools','Learning Content','Security','Audit Logs'].map(x=>`<div class="card" data-shortcut="${x}"><b>${x}</b><p class="small" style="margin-top:8px">Open module workspace →</p></div>`).join('')}
      </div>`;
    const content=document.getElementById('contentArea');
    content.innerHTML=overview;
    function showPage(page){
      document.getElementById('pageTitle').textContent=page==='Overview'?'Super Admin Overview':page;
      document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
      if(page==='Overview'){content.innerHTML=overview;attachShortcuts();return;}
      content.innerHTML=`<div class="card"><h2>${escapeHtml(page)}</h2><p>This module is prepared in the Super Admin workspace. Next, we will connect its real Supabase tables and secure actions.</p><div class="notice">No records or changes are being made yet.</div><div class="empty">Module interface placeholder — ready for the next build step.</div></div>`;
    }
    document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
    function attachShortcuts(){document.querySelectorAll('[data-shortcut]').forEach(c=>c.addEventListener('click',()=>showPage(c.dataset.shortcut)));}
    attachShortcuts();
    document.getElementById('logoutBtn').onclick=async()=>{await supabaseClient.auth.signOut();location.replace('admin-login.html');};
  }catch(e){app.innerHTML='<div class="access-denied"><h1>Could not verify access</h1><p>Please check your connection and Supabase setup, then sign in again.</p><button onclick="location.replace(\\'admin-login.html\\')">Back to admin login</button></div>';}
  function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
})();
</script>
</body>
</html>
