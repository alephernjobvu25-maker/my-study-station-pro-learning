<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create student account | My Study Station Pro Learning</title>
<style>
:root{color-scheme:dark;--bg:#090d20;--panel:#121a30;--line:#2b3b5c;--text:#edf3ff;--muted:#a9b6d1;--gold:#f3d276;--cyan:#13d8ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;display:grid;place-items:center;background:radial-gradient(ellipse at 10% 0%,#40207c 0,transparent 38%),radial-gradient(ellipse at 100% 100%,#063d92 0,transparent 45%),var(--bg);font:15px system-ui;color:var(--text)}
.shell{width:min(100%,480px)}.brand{display:block;text-align:center;margin:0 auto 18px}.brand img{width:min(100%,290px);height:auto}.card{padding:25px;border:1px solid var(--line);border-radius:22px;background:#121a30ee;box-shadow:0 20px 55px #0006}
.kicker{color:var(--gold);font-size:11px;letter-spacing:1.3px;font-weight:800}h1{margin:8px 0;font-size:28px}p{color:var(--muted);line-height:1.5}label{display:block;margin:13px 0 6px;color:#cbd7ee;font-size:13px}input,select{width:100%;padding:12px;border:1px solid #344665;border-radius:10px;background:#0a1224;color:white;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:linear-gradient(100deg,#16cce8,#8071ff);color:#081126;font-weight:800;font-size:15px}button:disabled{opacity:.6}#message{min-height:20px;font-size:13px}.error{color:#ff9ba9}.success{color:#7be3b8}.foot{text-align:center;font-size:13px}.foot a{color:var(--gold);text-decoration:none}
</style></head><body><main class="shell"><a class="brand" href="index.html"><img src="mystudystation-pro-learning-logo.png" alt="My Study Station Pro Learning"></a>
<section class="card"><div class="kicker">STUDENT REGISTRATION</div><h1>Create your account</h1><p>Register to begin your ECZ-focused learning journey.</p>
<form id="register-form">
<label for="display-name">Full name</label><input id="display-name" autocomplete="name" maxlength="100" required placeholder="Your full name">
<label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
<label for="school">School (optional)</label><select id="school"><option value="">Choose a verified school (optional)</option></select>
<label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
<label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat password">
<button type="submit">Create student account</button><p id="message" role="status"></p>
</form><p class="foot">Already registered? <a href="login.html">Log in</a> · <a href="admin-login.html">Administrator sign in</a></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js"></script>
<script>if(!window.supabaseClient){const m=document.getElementById('message');m.textContent='Connection setup failed: Supabase client did not initialize. Check internet/CDN and supabase.js.';m.className='error';}</script>
</body></html>
