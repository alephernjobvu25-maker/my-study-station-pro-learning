<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Pro Learning</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-shell"><a class="brand brand-link" href="index.html"><span class="brand-mark">✦</span> MY STUDY STATION <small>PRO LEARNING</small></a><section class="auth-card"><div class="eyebrow">START YOUR JOURNEY</div><h1>Create your account.</h1><p class="muted">Use an email you can access for confirmation.</p><form id="register-form"><label>Full name<input id="display-name" autocomplete="name" required maxlength="80" placeholder="Your full name"></label><label>Email address<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>School (optional)<select id="school"><option value="">Choose later</option></select></label><label>Password<input id="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"></label><label>Confirm password<input id="confirm-password" type="password" autocomplete="new-password" required minlength="8" placeholder="Repeat password"></label><button class="btn btn-gold full" type="submit">Create student account</button><p id="message" class="message" role="status"></p></form><p class="auth-foot">Already registered? <a href="login.html">Log in</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="auth.js"></script></body></html>
