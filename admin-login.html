<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Study Station Pro | Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#24224a 0%,#0b1020 55%);color:#edf2ff;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{width:min(100%,440px)}.brand{text-align:center;margin-bottom:22px}.brand img{display:block;width:min(100%,320px);height:auto;margin:0 auto;filter:drop-shadow(0 8px 18px #0005)}.panel{background:rgba(18,26,45,.94);border:1px solid #2b3653;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0005}h1{margin:0 0 8px;font-size:26px}p{color:#9eacc8;line-height:1.5;margin:0 0 22px}.tag{display:inline-block;border:1px solid #66552e;border-radius:99px;padding:5px 10px;color:#f3c969;font-size:11px;letter-spacing:1px;margin-bottom:15px}label{display:block;margin:14px 0 7px;font-size:13px;color:#c9d4eb}input{width:100%;padding:13px 14px;border:1px solid #33415e;border-radius:11px;background:#0c1426;color:#fff;font-size:16px;outline:none}input:focus{border-color:#8b7cff}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:linear-gradient(100deg,#8b7cff,#6e60e8);color:#fff;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.65;cursor:wait}#message{margin:14px 0 0;font-size:13px;color:#ff9aa8;min-height:18px}.student{text-align:center;margin-top:18px;color:#9eacc8;font-size:13px}.student a{color:#f3c969;text-decoration:none}.security{text-align:center;font-size:12px;color:#72809d;margin-top:18px}
</style></head><body><div class="wrap"><div class="brand"><img src="mystudystation-pro-learning-logo.png" alt="My Study Station Pro Learning logo"></div><section class="panel"><span class="tag">RESTRICTED ADMINISTRATOR ACCESS</span><h1>Administrator sign in</h1><p>Sign in to access your assigned administration workspace.</p><form id="adminLoginForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><button id="loginBtn" type="submit">Sign in securely</button><div id="message" role="status"></div></form></section><div class="student">Are you a student? <a href="login.html">Go to student login</a></div><div class="security">Administrator permissions are checked against the Supabase database.</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script>
const form=document.getElementById('adminLoginForm'),message=document.getElementById('message'),btn=document.getElementById('loginBtn');
form.addEventListener('submit',async event=>{event.preventDefault();message.textContent='';btn.disabled=true;btn.textContent='Verifying account…';try{if(!window.supabaseClient)throw new Error('Supabase client was not found. Check supabase.js.');const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;if(!data.session)throw new Error('Sign-in session was not created.');const {data:isSuper,error:superError}=await supabaseClient.rpc('is_super_admin');if(!superError&&isSuper===true){location.replace('super-admin.html');return;}const {data:isAdmin,error:adminError}=await supabaseClient.rpc('is_platform_admin');if(!adminError&&isAdmin===true){location.replace('admin.html');return;}await supabaseClient.auth.signOut();throw new Error('Access denied. This account has no active administrator role.');}catch(error){message.textContent=error.message||'Sign-in failed. Please try again.';}finally{btn.disabled=false;btn.textContent='Sign in securely';}});
</script></body></html>
